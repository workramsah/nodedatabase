<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 0.95em;
        }

        input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
            padding: 8px;
            font-size: 0.9em;
        }

        .btn-danger:hover {
            background: #ff5252;
        }

        .users-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .user-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .user-item:hover {
            background: #f0f2f7;
            transform: translateX(5px);
        }

        .user-info h3 {
            color: #333;
            margin-bottom: 5px;
            font-size: 1.1em;
        }

        .user-info p {
            color: #666;
            font-size: 0.95em;
        }

        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 30px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👥 User Management System</h1>

        <div class="content">
            <!-- Create User Card -->
            <div class="card">
                <h2>➕ Add New User</h2>
                <div id="createMessage"></div>
                <form onsubmit="createUser(event)">
                    <div class="form-group">
                        <label for="userName">Name:</label>
                        <input type="text" id="userName" placeholder="Enter user name" required>
                    </div>
                    <div class="form-group">
                        <label for="userAge">Age:</label>
                        <input type="number" id="userAge" placeholder="Enter age" required min="1" max="120">
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn-primary">Add User</button>
                        <button type="button" class="btn-secondary" onclick="clearForm()">Clear</button>
                    </div>
                </form>
            </div>

            <!-- Fetch User Card -->
            <div class="card">
                <h2>🔍 Find User by ID</h2>
                <div id="fetchMessage"></div>
                <form onsubmit="fetchUserById(event)">
                    <div class="form-group">
                        <label for="userId">User ID:</label>
                        <input type="number" id="userId" placeholder="Enter user ID" required min="1">
                    </div>
                    <button type="submit" class="btn-primary">Search User</button>
                </form>
                <div id="fetchResult" style="margin-top: 15px;"></div>
            </div>

            <!-- Users List Card -->
            <div class="card full-width">
                <h2>📋 All Users</h2>
                <div id="listMessage"></div>
                <div class="button-group" style="margin-bottom: 20px;">
                    <button onclick="fetchAllUsers()" class="btn-primary">Refresh Users</button>
                </div>
                <div id="usersList" class="users-list"></div>
            </div>
        </div>
    </div>

    <script>
        // API Base URL
        const API_URL = '/api/users'

        // Create User
        async function createUser(event) {
            event.preventDefault()
            const name = document.getElementById('userName').value
            const age = document.getElementById('userAge').value
            const messageDiv = document.getElementById('createMessage')

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, age })
                })

                const data = await response.json()

                if (response.ok) {
                    messageDiv.innerHTML = `<div class="message success">✅ User created successfully!</div>`
                    clearForm()
                    fetchAllUsers()
                    setTimeout(() => messageDiv.innerHTML = '', 3000)
                } else {
                    messageDiv.innerHTML = `<div class="message error">❌ ${data.error}</div>`
                }
            } catch (error) {
                messageDiv.innerHTML = `<div class="message error">❌ Error creating user</div>`
                console.error('Error:', error)
            }
        }

        // Fetch All Users
        async function fetchAllUsers() {
            const listDiv = document.getElementById('usersList')
            const messageDiv = document.getElementById('listMessage')

            try {
                const response = await fetch(API_URL)
                const users = await response.json()

                if (users.length === 0) {
                    listDiv.innerHTML = '<div class="empty-state">No users found. Create one to get started!</div>'
                } else {
                    listDiv.innerHTML = users.map(user => `
                        <div class="user-item">
                            <div class="user-info">
                                <h3>#${user.id} - ${user.name}</h3>
                                <p>Age: ${user.age} years old</p>
                            </div>
                            <div class="button-group" style="width: auto; gap: 5px;">
                                <button class="btn-danger" onclick="deleteUser(${user.id})">Delete</button>
                            </div>
                        </div>
                    `).join('')
                }
            } catch (error) {
                messageDiv.innerHTML = `<div class="message error">❌ Error fetching users</div>`
                console.error('Error:', error)
            }
        }

        // Fetch User by ID
        async function fetchUserById(event) {
            event.preventDefault()
            const userId = document.getElementById('userId').value
            const resultDiv = document.getElementById('fetchResult')
            const messageDiv = document.getElementById('fetchMessage')

            try {
                const response = await fetch(`${API_URL}/${userId}`)
                const data = await response.json()

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="user-item" style="border: none; background: #fff3cd;">
                            <div class="user-info">
                                <h3>ID: ${data.id}</h3>
                                <p><strong>Name:</strong> ${data.name}</p>
                                <p><strong>Age:</strong> ${data.age}</p>
                            </div>
                        </div>
                    `
                    messageDiv.innerHTML = ''
                } else {
                    resultDiv.innerHTML = ''
                    messageDiv.innerHTML = `<div class="message error">❌ User not found</div>`
                    setTimeout(() => messageDiv.innerHTML = '', 3000)
                }
            } catch (error) {
                resultDiv.innerHTML = ''
                messageDiv.innerHTML = `<div class="message error">❌ Error fetching user</div>`
                console.error('Error:', error)
            }
        }

        // Delete User
        async function deleteUser(userId) {
            if (confirm('Are you sure you want to delete this user?')) {
                try {
                    const response = await fetch(`${API_URL}/${userId}`, {
                        method: 'DELETE'
                    })

                    if (response.ok) {
                        fetchAllUsers()
                    }
                } catch (error) {
                    alert('Error deleting user')
                    console.error('Error:', error)
                }
            }
        }

        // Clear Form
        function clearForm() {
            document.getElementById('userName').value = ''
            document.getElementById('userAge').value = ''
        }

        // Load users on page load
        window.onload = fetchAllUsers
    </script>
</body>
</html>
